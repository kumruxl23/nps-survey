<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NPS Survey Tool — Login</title>
  <link href="{{ url_for('static', filename='vendor/bootstrap/bootstrap.min.css') }}" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container">
    <div class="row justify-content-center mt-5">
      <div class="col-md-4">
        <div class="card shadow-sm">
          <div class="card-body">
            <h4 class="card-title text-center mb-4">NPS Survey Tool</h4>
            {% if error %}
            <div class="alert alert-danger py-2">{{ error }}</div>
            {% endif %}
            {% if midway_denied %}
            <div class="alert alert-warning py-2">
              <strong>Access not provisioned.</strong><br>
              You're signed in with Midway as
              <code>{{ alias or "unknown" }}</code>, but this alias has no
              role in the NPS Survey Tool yet. Ask an admin to add you.
            </div>
            {% else %}
            <form method="POST" action="/nps/auth/login">
              <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" class="form-control" name="username" required autofocus>
              </div>
              <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" name="password" required>
              </div>
              <button type="submit" class="btn btn-primary w-100">Sign In</button>
            </form>
            {% endif %}
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
